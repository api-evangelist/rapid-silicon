aid: rapid-silicon
name: Rapid Silicon
description: >-
  Rapid Silicon is a fabless semiconductor company founded in 2019 and headquartered in Los Gatos,
  California, building AI- and intelligent-edge-focused FPGAs and embedded FPGA (eFPGA) IP on an
  open-source technology base. Its product line covers the Gemini FPGA family, the Vega eFPGA IP core
  (a customizable, scalable embeddable FPGA fabric from roughly 1.5K to 100K+ logic cells with
  configurable BRAM and DSP MAC tiles), and the Rapid eFPGA Configurator for self-service eFPGA
  resource sizing. Design work is done in the Raptor Design Suite, the company's RTL-to-bitstream
  EDA tool-chain covering simulation, synthesis, placement, routing, bitstream generation and device
  configuration, released under GPL3 as what the company describes as the first complete
  commercially available open-source FPGA tool-chain. Rapid Silicon raised a $15M seed round in 2021
  and a $30M Series A in January 2023 from Cambium Capital Partners and Chengwei Capital, and is led
  by chairman and CEO Naveed Sherwani. The company's products are silicon IP and locally installed
  design software rather than a hosted service, so it publishes no public web API, developer portal
  or machine-readable API contract; as of 2026-05-25 its rapidsilicon.com website no longer serves
  company content and redirects to a domain-brokerage page.
